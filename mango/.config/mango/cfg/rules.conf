# | Rules |
# Window/Tag/Layer rules. | https://mangowm.github.io/docs/window-management/rules

window_rule = is_floating:1, app_id:[Ss]team
window_rule = is_floating:0, title:Steam
window_rule = is_floating:1, app_id:steam, title:Steam Settings

# Always place Chromium on tag 3 without switching to it or focusing it
window_rule=tags:3,is_open_silent:1,is_tag_silent:1,app_id:chromium

layer_rule = no_animation:1, no_blur:1, layer_name:selection

# Brave picture-in-picture: float and stay visible on every workspace
window_rule = is_floating:1, is_global:1, app_id:brave-browser, title:Picture in picture
